name: E2E Click Tests

# MANUAL ONLY. The nightly schedule was removed 2026-08-13.
#
# The 2026-06-12 cost note this replaces reasoned about Actions minutes, which
# do not apply here: modex-gtm is a PUBLIC repository on standard
# `ubuntu-latest` runners, and GitHub does not charge for those. The nightly run
# was dropped because it earned nothing, not because it cost anything.
#
# It ran every day against production and could only tell us something the
# release gate and the post-deploy smoke had not already established — and it
# reported at 6am against whatever happened to be deployed, with nobody on the
# hook to read it. No production defect class was ever attributed to it.
#
# Run it deliberately before a risky ship: `gh workflow run e2e.yml`.
on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Wait for Vercel deployment
        run: sleep 60

      - run: npx playwright test
        env:
          BASE_URL: https://modex-gtm.vercel.app

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
