name: E2E Click Tests

# Cost note (2026-06-12): per-push E2E was ~100 min/day of Actions
# at this repo's push cadence. Nightly + manual covers the regression
# net; run `gh workflow run e2e.yml` before a risky ship.
on:
  workflow_dispatch:
  schedule:
    # Nightly at 6am ET (10:00 UTC) — daily health check before the workday
    - cron: '0 10 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Wait for Vercel deployment
        run: sleep 60

      - run: npx playwright test
        env:
          BASE_URL: https://modex-gtm.vercel.app

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
